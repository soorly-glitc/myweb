<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gaegu&family=Gowun+Dodum&display=swap" rel="stylesheet">
    <style>
        .gaegu-regular {
            font-family: "Gaegu", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        .gowun-dodum-regular {
            font-family: "Gowun Dodum", sans-serif;
            font-weight: 400;
            font-style: normal;
        }
        #gaegu:checked + label{ /*선택했을 때 라벨 효과를 주겠다*/
            font-family: "Gaegu", sans-serif;
            font-weight: 400;
            font-style: normal;
            color: red;
            font-size: 1.5em;
        }
        .d1:has(#gaegu:checked) ~ .d2 #msg {
            font-family: "Gaegu", sans-serif;
            font-weight: 400;
            font-style: normal;
            color: blue;
            font-size: 1.5em;
        }

    </style>
<body>
    <div class="d1">
        <input type="radio" name="font" id="gaegu"> <!--  id="gaegu" checked>   페이지 열릴 때 체크되어 열림(동의/비동의 중엔 비동의가 기본)-->
        <label for="gaegu">Gaegu 폰트</label>
        <input type="radio" name="font" id="Gowun+Dodum">
        <label for="Gowun+Dodum">Gowun+Dodum 폰트</label>
    </div>
    <div class="d2">
        <textarea rows="5" cols="80" id="msg"></textarea>
    </div>
</body>
</html>
