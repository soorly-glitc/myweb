<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미운 아기 오리 - 안데르센의 명작 동화</title>
  
  <!-- 웹 폰트 (동화책 분위기의 폰트) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@400;700&family=Pretendard:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* Reset & Base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Pretendard', sans-serif;
    }

    /* 1. 전체 배경 (나무 테이블 감성) */
    .wood-background {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #8d5b32 0%, #4a2d13 70%, #2a1808 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* 반짝이는 숲속 빛가루 효과 */
    .sparkle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 238, 173, 0.8);
      box-shadow: 0 0 12px #ffeead, 0 0 20px #ffd700;
      animation: floatSparkle 4s infinite ease-in-out;
      pointer-events: none;
    }

    .sparkle-1 { top: 15%; left: 18%; width: 6px; height: 6px; animation-delay: 0s; }
    .sparkle-2 { top: 25%; right: 15%; width: 8px; height: 8px; animation-delay: 1.2s; }
    .sparkle-3 { bottom: 20%; left: 12%; width: 5px; height: 5px; animation-delay: 2.1s; }
    .sparkle-4 { bottom: 15%; right: 20%; width: 7px; height: 7px; animation-delay: 0.8s; }

    @keyframes floatSparkle {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.3); opacity: 0.9; }
    }

    /* 2. 동화책 프레임 (3D 양장본 느낌) */
    .book-container {
      position: relative;
      width: 100%;
      max-width: 920px;
      height: 520px;
      background: #fbf7ee;
      border-radius: 20px;
      border: 8px solid #f4e8c1;
      box-shadow: 
        0 25px 50px rgba(0, 0, 0, 0.6),
        inset 0 0 30px rgba(139, 90, 43, 0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 30px 25px;
      transition: transform 0.4s ease, box-shadow 0.4s ease;
    }

    .book-container:hover {
      transform: translateY(-4px) rotate(-0.5deg);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.65);
    }

    /* 금빛 테두리 장선 디테일 */
    .book-frame-border {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      bottom: 14px;
      border: 2px solid #d4af37;
      border-radius: 12px;
      pointer-events: none;
      opacity: 0.7;
    }

    /* 3. 헤더 & 타이틀 */
    .header-section {
      text-align: center;
      z-index: 2;
    }

    .footprints {
      font-size: 1.2rem;
      color: #e09f3e;
      letter-spacing: 12px;
      margin-bottom: 4px;
      user-select: none;
    }

    .book-title {
      font-family: 'Gaegu', cursive;
      font-size: 3.8rem;
      font-weight: 700;
      color: #2b5e3b;
      text-shadow: 2px 2px 0px #e2f0d9, -1px -1px 0px #ffffff;
      letter-spacing: -1px;
      margin-bottom: 2px;
    }

    .book-subtitle {
      font-family: 'Gowun Batang', serif;
      font-size: 1.05rem;
      color: #5c7e5a;
      display: inline-block;
      padding: 2px 16px;
      background: rgba(226, 240, 217, 0.5);
      border-radius: 20px;
    }

    /* 4. 중앙 삽화 영역 */
    .illustration-area {
      position: relative;
      width: 100%;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    /* 오리 및 호수 그래픽 레이아웃 (이미지 대체용 CSS 일러스트) */
    .lake-scene {
      position: relative;
      width: 280px;
      height: 160px;
      background: linear-gradient(180deg, #d8eeeb 0%, #a2d5ce 100%);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
    }

    .main-duck {
      font-size: 4.5rem;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.15));
      animation: floatDuck 3s infinite ease-in-out;
    }

    .side-duck {
      position: absolute;
      font-size: 2.2rem;
      right: 20px;
      bottom: 25px;
      opacity: 0.85;
    }

    @keyframes floatDuck {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(-2deg); }
    }

    /* 5. 하단 버튼 및 카피라이트 */
    .bottom-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 2;
    }

    /* 나무 판자 느낌의 시작 버튼 */
    .btn-start {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 42px;
      font-family: 'Gaegu', cursive;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(180deg, #a66a38 0%, #7c481f 100%);
      border: 3px solid #f2cf87;
      border-radius: 40px;
      text-decoration: none;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25), inset 0 2px 2px rgba(255,255,255,0.3);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-start:hover {
      transform: scale(1.06);
      background: linear-gradient(180deg, #b87743 0%, #8c5224 100%);
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.35);
    }

    .btn-start:active {
      transform: scale(0.98);
    }

    .copyright-text {
      font-size: 0.85rem;
      color: #8c7b6c;
      letter-spacing: 1px;
    }

    /* 반응형 레이아웃 */
    @media (max-width: 768px) {
      .book-container {
        height: 480px;
        padding: 30px 20px 20px;
      }
      .book-title {
        font-size: 2.8rem;
      }
      .btn-start {
        font-size: 1.3rem;
        padding: 12px 32px;
      }
    }
  </style>
</head>
<body>

  <div class="wood-background">
    <!-- 신비로운 빛 효과 -->
    <div class="sparkle sparkle-1"></div>
    <div class="sparkle sparkle-2"></div>
    <div class="sparkle sparkle-3"></div>
    <div class="sparkle sparkle-4"></div>

    <!-- 양장본 동화책 커버 Container -->
    <div class="book-container">
      <div class="book-frame-border"></div>

      <!-- 상단 타이틀 -->
      <header class="header-section">
        <div class="footprints">🐾 🐾 🐾</div>
        <h1 class="book-title">‘미운 아기 오리’</h1>
        <span class="book-subtitle">🌱 안데르센의 명작 동화 🌱</span>
      </header>

      <!-- 중앙 동화 일러스트 영역 -->
      <div class="illustration-area">
        <div class="lake-scene">
          <div class="main-duck">🐥</div>
          <div class="side-duck">🐤</div>
        </div>
      </div>

      <!-- 하단 읽으러 가기 버튼 & 출처 -->
      <footer class="bottom-section">
        <a href="book_p1.html" class="btn-start">
          🍃 동화 읽으러 가기
        </a>
      </footer>
    </div>
  </div>

</body>
</html>
