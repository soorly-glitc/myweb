<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-color: #F6F8F8;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-align: center;
        }

        header {
            margin-top: 370px;
            padding: 20px 0;
            font-size: 20px;
            font-weight: bold;
        }

        /* [수정 2] GNB 메뉴바 (ul 기본 스타일 초기화) */
        .bar {
            display: flex;
            justify-content: center;
            list-style: none;
            padding: 0;
            margin: 0;
            border: 1px solid red;
        }

        /* 메인 메뉴 항목 (li) */
        .menu {
            position: relative; /* 서브메뉴 위치의 기준점 */
            width: 100px;
            border: 1px solid blue;
        }

        /* 메인 메뉴 링크 (a) */
        .menu > a {
            display: block;
            text-decoration: none;
            color: black;
            padding: 10px 0;
        }

        /* 서브메뉴 기본 숨김 */
        .sub-menu {
            display: none;
            position: absolute;
            top: 100%;       /* 메인메뉴 바로 아래 */
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            background-color: #ffffff;
            border: 1px solid #ddd;
            list-style: none;
            padding: 0;
            margin: 0;
            z-index: 100;
        }

        /* [핵심] li.menu에 마우스 올리면 서브메뉴 표시 */
        .menu:hover .sub-menu {
            display: block;
        }

        /* 서브메뉴 내부 링크 스타일 */
        .sub-menu li a {
            display: block;
            padding: 8px 0;
            text-decoration: none;
            color: #333;
            background-color: #ffffff;
        }

        .sub-menu li a:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>
  <header>쉽게 고를 수 있는 꽃집</header>
    
    <!-- a 태그 감싸기 대신 ul > li 구조 사용 -->
    <ul class="bar">
        <li class="menu"><a href="index2.html">Board</a></li>
        <li class="menu"><a href="index2.html">Search</a></li>
        <li class="menu"><a href="index2.html">Login</a></li>
        <li class="menu">
            <a href="index2.html">Menu</a>
            <ul class="sub-menu">
                <li><a href="#">전체상품</a></li>
                <li><a href="#">화환</a></li>
                <li><a href="#">화분</a></li>
                <li><a href="index2.html">꽃다발</a></li>
                <li><a href="#">꽃바구니</a></li>
            </ul>
        </li>
        <li class="menu"><a href="index4.html">산출물</a></li>
        
    </ul>
</body>
</html>
