<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소중한 사람에게 메시지를 전해보세요</title>
  <!-- 감성적인 분위기를 위한 구글 폰트 (Pretendard / Noto Serif KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Pretendard:wght@300;400;600&display=swap" rel="stylesheet">
  
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      font-family: 'Pretendard', sans-serif;
      overflow: hidden;
      background-color: #0f0f12;
      color: #ffffff;
    }

    /* Ambient Background Effect */
    .bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      overflow: hidden;
    }

    .glow-circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.45;
      animation: pulse 8s infinite alternate ease-in-out;
    }

    .glow-1 {
      top: -10%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, #ff8a00, #e52e71);
    }

    .glow-2 {
      bottom: -15%;
      right: -10%;
      width: 65vw;
      height: 65vw;
      background: radial-gradient(circle, #7928ca, #ff0080);
      animation-delay: -4s;
    }

    @keyframes pulse {
      0% {
        transform: scale(1) translate(0, 0);
      }
      100% {
        transform: scale(1.15) translate(30px, -20px);
      }
    }

    /* Intro Main Layout */
    .intro-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(10px);
    }

    .content-box {
      max-width: 640px;
      width: 100%;
      animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Message Typography */
    .sub-title {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 24px;
      text-transform: uppercase;
    }

    .main-message {
      font-family: 'Noto Serif KR', serif;
      font-size: 2.8rem;
      font-weight: 600;
      line-height: 1.45;
      word-break: keep-all;
      margin-bottom: 48px;
      background: linear-gradient(135deg, #ffffff 30%, rgba(255, 255, 255, 0.7));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .main-message span {
      display: block;
      position: relative;
    }

    /* Action Button */
    .btn-wrapper {
      display: inline-block;
    }

    .btn-start {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 18px 42px;
      font-size: 1.15rem;
      font-weight: 600;
      color: #111;
      background-color: #ffffff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn-start:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 15px 35px rgba(255, 255, 255, 0.35);
      background-color: #ffffff;
    }

    .btn-start:active {
      transform: translateY(0) scale(0.98);
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      transition: transform 0.3s ease;
    }

    .btn-start:hover .btn-icon {
      transform: translateX(4px);
    }

    /* Animations */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .main-message {
        font-size: 2.1rem;
        margin-bottom: 36px;
      }
      .btn-start {
        padding: 16px 36px;
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>

  <!-- Background Glow Effect -->
  <div class="bg-container">
    <div class="glow-circle glow-1"></div>
    <div class="glow-circle glow-2"></div>
  </div>

  <!-- Intro Main Content -->
  <main class="intro-container">
    <div class="content-box">
      <p class="sub-title">Heartfelt Message</p>
      <h1 class="main-message">
        지금 소중한 사람에게<br>
        메시지를 전해보세요
      </h1>
      <div class="btn-wrapper">
        <!-- 메인 페이지 이동 연결 (ex: main.html) -->
        <a href="main.html" class="btn-start">
          <span>카드 쓰러 가기</span>
          <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </main>

</body>
</html>
